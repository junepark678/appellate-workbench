name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC 14 / Qt 6.11.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen
      TZ: UTC

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            g++-14 \
            fonts-dejavu-core \
            libarchive-dev \
            libgl1-mesa-dev \
            libgstreamer-gl1.0-0 \
            libpulse-dev \
            libsodium-dev \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb-dev \
            libxcb1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            ninja-build \
            pkg-config \
            python3-venv \
            uidmap

      - name: Install Qt
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-cache-dir \
            "aqtinstall==3.3.0" \
            "py7zr==1.0.0" \
            "setuptools==80.9.0"
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/aqt/bin/aqt" install-qt \
              linux \
              desktop \
              6.11.1 \
              linux_gcc_64 \
              --outputdir "$RUNNER_TEMP/Qt" \
              --modules qtpdf
          )

          qt_root="$RUNNER_TEMP/Qt/6.11.1/gcc_64"
          test -x "$qt_root/bin/qmake"
          test -f "$qt_root/lib/cmake/Qt6/Qt6Config.cmake"
          printf '%s\n' "$qt_root/bin" >> "$GITHUB_PATH"
          printf '%s\n' \
            "CMAKE_PREFIX_PATH=$qt_root${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" \
            "LD_LIBRARY_PATH=$qt_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "PKG_CONFIG_PATH=$qt_root/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            "QML2_IMPORT_PATH=$qt_root/qml" \
            "QT_PLUGIN_PATH=$qt_root/plugins" \
            "QT_ROOT_DIR=$qt_root" \
            "Qt6_DIR=$qt_root/lib/cmake/Qt6" \
            >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          qt_version="$(qmake -query QT_VERSION)"
          printf 'Qt %s\n' "$qt_version"
          test "$qt_version" = 6.11.1

      - name: Configure
        run: cmake --preset dev -DAPPELLATE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: |
          ulimit -n 65536
          install -d -m 700 /tmp/appellate-workbench-ci
          TMPDIR=/tmp/appellate-workbench-ci ctest --preset dev --no-tests=error

name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: opensuse/tumbleweed:latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Install build dependencies
        run: >-
          zypper --non-interactive install --no-recommends
          git cmake ninja gcc-c++ clang qt6-base-devel qt6-sql-sqlite
          qt6-pdf-devel qt6-pdfwidgets-devel libarchive-devel

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: cmake --preset dev -DAPPELLATE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset dev

  sanitizers:
    name: GCC ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: opensuse/tumbleweed:latest
    steps:
      - name: Install build dependencies
        run: >-
          zypper --non-interactive install --no-recommends
          git cmake ninja gcc-c++ qt6-base-devel qt6-sql-sqlite
          qt6-pdf-devel qt6-pdfwidgets-devel libarchive-devel

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: cmake --preset asan -DAPPELLATE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset asan
